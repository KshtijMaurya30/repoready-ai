services:
  - type: web
    name: repoready-ai-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GEMMA_MODEL
        sync: false
      - key: GEMMA_MODEL_SUPPORTS_VISION
        value: "false"
      - key: FRONTEND_ORIGINS
        value: '["https://repoready-ai-web.onrender.com"]'
      - key: GITHUB_TOKEN
        sync: false

  - type: web
    name: repoready-ai-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://repoready-ai-api.onrender.com
